<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="220" viewBox="0 0 1200 220"
     role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">readless 核心朗读流程</title>
  <desc id="flowDesc">展示从选中文字到开始聆听的五步流程：选中文字、按快捷键、文本清洗、语音合成、迷你播放器播放。</desc>

  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1220"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" rx="20" fill="url(#flowBg)"/>

  <!-- Step 1: Select text -->
  <g transform="translate(40 50)">
    <rect x="0" y="0" width="180" height="120" rx="16" fill="#161B2C" stroke="#2A3045" stroke-width="1"/>
    <!-- Text cursor icon -->
    <g transform="translate(72 24)">
      <rect x="0" y="0" width="3" height="40" rx="1.5" fill="#4A9EFF"/>
      <rect x="-6" y="0" width="15" height="3" rx="1.5" fill="#4A9EFF"/>
      <rect x="-6" y="37" width="15" height="3" rx="1.5" fill="#4A9EFF"/>
    </g>
    <text x="90" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="16" font-weight="600" fill="#ECEFF4" text-anchor="middle">选中文字</text>
    <text x="90" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">任意应用中选区</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(232 100)" stroke="#3A4055" stroke-width="1.5" fill="none">
    <line x1="0" y1="10" x2="28" y2="10"/>
    <polyline points="22,4 30,10 22,16"/>
  </g>

  <!-- Step 2: Hotkey -->
  <g transform="translate(270 50)">
    <rect x="0" y="0" width="180" height="120" rx="16" fill="#161B2C" stroke="#2A3045" stroke-width="1"/>
    <!-- Key icon -->
    <g transform="translate(60 20)">
      <rect x="0" y="0" width="60" height="44" rx="8" fill="#1C2238" stroke="#4A9EFF" stroke-width="1.5"/>
      <text x="30" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" font-weight="700" fill="#4A9EFF" text-anchor="middle">⌥R</text>
    </g>
    <text x="90" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="16" font-weight="600" fill="#ECEFF4" text-anchor="middle">按快捷键</text>
    <text x="90" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">全局触发朗读</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(462 100)" stroke="#3A4055" stroke-width="1.5" fill="none">
    <line x1="0" y1="10" x2="28" y2="10"/>
    <polyline points="22,4 30,10 22,16"/>
  </g>

  <!-- Step 3: Text sanitization -->
  <g transform="translate(500 50)">
    <rect x="0" y="0" width="180" height="120" rx="16" fill="#161B2C" stroke="#2A3045" stroke-width="1"/>
    <!-- Sanitize icon: filter -->
    <g transform="translate(70 22)" fill="none" stroke="#5EBA7D" stroke-width="2" stroke-linejoin="round">
      <path d="M0 4 L40 4 L26 22 L26 38 L14 34 L14 22 Z"/>
    </g>
    <text x="90" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="16" font-weight="600" fill="#ECEFF4" text-anchor="middle">文本清洗</text>
    <text x="90" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">过滤 URL 与硬断行</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(692 100)" stroke="#3A4055" stroke-width="1.5" fill="none">
    <line x1="0" y1="10" x2="28" y2="10"/>
    <polyline points="22,4 30,10 22,16"/>
  </g>

  <!-- Step 4: Speech synthesis -->
  <g transform="translate(730 50)">
    <rect x="0" y="0" width="180" height="120" rx="16" fill="#161B2C" stroke="#2A3045" stroke-width="1"/>
    <!-- Cloud speech icon -->
    <g transform="translate(65 22)">
      <path d="M15 0 C7 0 0 6 0 14 C0 18 2 22 5 25 L5 32 L12 28 C13 28 14 29 15 29 C23 29 30 23 30 15 C30 7 23 0 15 0 Z"
            fill="none" stroke="#4A9EFF" stroke-width="1.5"/>
      <!-- Sound waves -->
      <path d="M35 8 Q40 15 35 22" fill="none" stroke="#4A9EFF" stroke-width="1.5"/>
      <path d="M42 4 Q50 15 42 26" fill="none" stroke="#4A9EFF" stroke-width="1.5"/>
    </g>
    <text x="90" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="16" font-weight="600" fill="#ECEFF4" text-anchor="middle">语音合成</text>
    <text x="90" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">发送至你的服务商</text>
  </g>

  <!-- Arrow 4 -->
  <g transform="translate(922 100)" stroke="#3A4055" stroke-width="1.5" fill="none">
    <line x1="0" y1="10" x2="28" y2="10"/>
    <polyline points="22,4 30,10 22,16"/>
  </g>

  <!-- Step 5: Mini player -->
  <g transform="translate(960 50)">
    <rect x="0" y="0" width="200" height="120" rx="16" fill="#161B2C" stroke="#2A3045" stroke-width="1"/>
    <!-- Waveform icon -->
    <g transform="translate(70 22)">
      <rect x="0"  y="12" width="3" height="16" rx="1.5" fill="#5EBA7D"/>
      <rect x="7"  y="6"  width="3" height="28" rx="1.5" fill="#5EBA7D"/>
      <rect x="14" y="10" width="3" height="20" rx="1.5" fill="#5EBA7D"/>
      <rect x="21" y="2"  width="3" height="36" rx="1.5" fill="#5EBA7D"/>
      <rect x="28" y="8"  width="3" height="24" rx="1.5" fill="#5EBA7D"/>
      <rect x="35" y="14" width="3" height="12" rx="1.5" fill="#5EBA7D"/>
      <rect x="42" y="6"  width="3" height="28" rx="1.5" fill="#5EBA7D"/>
      <rect x="49" y="10" width="3" height="20" rx="1.5" fill="#5EBA7D"/>
      <rect x="56" y="12" width="3" height="16" rx="1.5" fill="#5EBA7D"/>
    </g>
    <text x="100" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="16" font-weight="600" fill="#ECEFF4" text-anchor="middle">开始聆听</text>
    <text x="100" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">迷你播放器 · 跨 App 不中断</text>
  </g>
</svg>
